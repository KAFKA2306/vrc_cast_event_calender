name: Sync public Pages now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-pages-now.yml

permissions:
  contents: write

concurrency:
  group: sync-public-pages-now
  cancel-in-progress: false

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download canonical assets
        env:
          SOURCE_BASE: https://raw.githubusercontent.com/KAFKA2306/cast_event_cal/main/public
        run: |
          set -euo pipefail
          mkdir -p /tmp/cast-event-cal
          for file in \
            index.html \
            events.json \
            health.json \
            calendar.ics \
            event-ontology.json \
            ontology-match-audit.json \
            yahoo-candidate-history.json \
            yahoo-classifier-audit.json \
            yahoo-positive-vocabulary.json \
            yahoo-query-ablation.json \
            yahoo-best-1000-audit.json \
            .nojekyll; do
            curl -fsSL --retry 5 --retry-all-errors --connect-timeout 10 --max-time 60 \
              "$SOURCE_BASE/$file" -o "/tmp/cast-event-cal/$file"
          done

      - name: Validate canonical state
        run: |
          set -euo pipefail
          grep -q 'VRChat Event Calendar' /tmp/cast-event-cal/index.html
          grep -q 'BEGIN:VCALENDAR' /tmp/cast-event-cal/calendar.ics
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/cast-event-cal')
          events = json.loads((root / 'events.json').read_text(encoding='utf-8'))
          health = json.loads((root / 'health.json').read_text(encoding='utf-8'))
          history = json.loads((root / 'yahoo-candidate-history.json').read_text(encoding='utf-8'))
          classifier = json.loads((root / 'yahoo-classifier-audit.json').read_text(encoding='utf-8'))
          best = json.loads((root / 'yahoo-best-1000-audit.json').read_text(encoding='utf-8'))
          sources = {row['name']: row for row in health['sources']}

          assert events['count'] == 555
          assert health['event_count'] == 555
          assert history['candidate_count'] == 2429
          assert classifier['classifier_version'] == '1.8'
          assert classifier['candidate_count'] == 2429
          assert classifier['accepted_count'] == 59
          assert classifier['rejected_count'] == 2370
          assert sources['yahoo_realtime_events']['count'] == 59
          assert best['candidate_count'] == 1000
          assert best['production_accepted_count'] == 50
          assert best['status'] == 'ok'
          PY

      - name: Publish mirror assets
        run: |
          set -euo pipefail
          for file in \
            index.html \
            events.json \
            health.json \
            calendar.ics \
            event-ontology.json \
            ontology-match-audit.json \
            yahoo-candidate-history.json \
            yahoo-classifier-audit.json \
            yahoo-positive-vocabulary.json \
            yahoo-query-ablation.json \
            yahoo-best-1000-audit.json \
            .nojekyll; do
            cp "/tmp/cast-event-cal/$file" "./$file"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            index.html events.json health.json calendar.ics \
            event-ontology.json ontology-match-audit.json \
            yahoo-candidate-history.json yahoo-classifier-audit.json \
            yahoo-positive-vocabulary.json yahoo-query-ablation.json \
            yahoo-best-1000-audit.json .nojekyll
          if git diff --cached --quiet; then
            echo 'Public mirror already current'
          else
            git commit -m 'chore: publish latest canonical calendar [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify public site
        env:
          PAGE_BASE: https://kafka2306.github.io/vrc_cast_event_calender
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 30); do
            root_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/live-index.html -w '%{http_code}' "$PAGE_BASE/" || true)"
            events_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/live-events.json -w '%{http_code}' "$PAGE_BASE/events.json" || true)"
            health_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/live-health.json -w '%{http_code}' "$PAGE_BASE/health.json" || true)"
            classifier_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/live-classifier.json -w '%{http_code}' "$PAGE_BASE/yahoo-classifier-audit.json" || true)"
            best_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/live-best.json -w '%{http_code}' "$PAGE_BASE/yahoo-best-1000-audit.json" || true)"
            if [ "$root_status" = '200' ] \
              && [ "$events_status" = '200' ] \
              && [ "$health_status" = '200' ] \
              && [ "$classifier_status" = '200' ] \
              && [ "$best_status" = '200' ] \
              && python - <<'PY'
          import json
          events = json.load(open('/tmp/live-events.json', encoding='utf-8'))
          health = json.load(open('/tmp/live-health.json', encoding='utf-8'))
          classifier = json.load(open('/tmp/live-classifier.json', encoding='utf-8'))
          best = json.load(open('/tmp/live-best.json', encoding='utf-8'))
          assert events['count'] == 555
          assert health['event_count'] == 555
          assert classifier['candidate_count'] == 2429
          assert classifier['accepted_count'] == 59
          assert classifier['rejected_count'] == 2370
          assert best['candidate_count'] == 1000
          assert best['production_accepted_count'] == 50
          PY
            then
              verified=true
              break
            fi
            sleep 10
          done
          test "$verified" = true

      - name: Remove one-time workflow and work branch
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git push origin --delete agent/sync-pages-20260803 || true
          rm .github/workflows/sync-pages-now.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/sync-pages-now.yml
          git commit -m 'chore: remove completed public Pages sync [skip ci]'
          git push origin HEAD:main
