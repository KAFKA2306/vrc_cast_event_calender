name: Deploy canonical cast_event_cal Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-canonical-pages.yml

permissions:
  contents: write

concurrency:
  group: canonical-cast-event-pages
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v6

      - name: Download canonical generated assets
        env:
          SOURCE_BASE: https://raw.githubusercontent.com/KAFKA2306/cast_event_cal/main/public
        run: |
          set -euo pipefail
          mkdir -p /tmp/cast-event-cal
          for file in \
            index.html \
            events.json \
            health.json \
            calendar.ics \
            event-ontology.json \
            ontology-match-audit.json \
            yahoo-candidate-history.json \
            yahoo-classifier-audit.json \
            yahoo-positive-vocabulary.json \
            .nojekyll; do
            curl -fsSL --retry 5 --retry-all-errors --connect-timeout 10 --max-time 60 \
              "$SOURCE_BASE/$file" -o "/tmp/cast-event-cal/$file"
          done

      - name: Validate canonical assets
        run: |
          set -euo pipefail
          grep -q 'VRChat Event Calendar' /tmp/cast-event-cal/index.html
          grep -q '公式リンク' /tmp/cast-event-cal/index.html
          grep -q 'BEGIN:VCALENDAR' /tmp/cast-event-cal/calendar.ics
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/cast-event-cal')
          events = json.loads((root / 'events.json').read_text(encoding='utf-8'))
          health = json.loads((root / 'health.json').read_text(encoding='utf-8'))
          ontology = json.loads((root / 'event-ontology.json').read_text(encoding='utf-8'))
          ontology_audit = json.loads((root / 'ontology-match-audit.json').read_text(encoding='utf-8'))
          history = json.loads((root / 'yahoo-candidate-history.json').read_text(encoding='utf-8'))
          classifier = json.loads((root / 'yahoo-classifier-audit.json').read_text(encoding='utf-8'))
          vocabulary = json.loads((root / 'yahoo-positive-vocabulary.json').read_text(encoding='utf-8'))

          assert events.get('count') == len(events.get('events', []))
          assert events.get('count', 0) >= 500
          assert health.get('event_count') == events.get('count')
          assert health.get('status') in {'ok', 'degraded'}
          assert health.get('enabled_sources', 0) >= 4
          sources = {item.get('name'): item for item in health.get('sources', [])}
          assert set(sources) >= {
              'repository_manual_events',
              'vrchat_calendar_discovery',
              'x_curated_events',
              'yahoo_realtime_events',
          }

          assert ontology.get('schema_version') == '1.1'
          assert len(ontology.get('entries', [])) >= 2
          assert ontology_audit.get('ontology_entries') == len(ontology.get('entries', []))
          assert ontology_audit.get('matched_events', 0) >= 2
          assert ontology_audit.get('ambiguous_events') == 0

          assert history.get('schema_version') == '2.3'
          assert history.get('retention_days') == 365
          assert history.get('target_count') == 1000
          assert history.get('target_reached') is True
          assert history.get('candidate_count', 0) >= 1000
          assert history.get('candidate_count') == len(history.get('candidates', []))
          assert sum(bool(row.get('query_keys')) for row in history.get('candidates', [])) >= 1000
          assert sum(bool(row.get('source_created_at')) for row in history.get('candidates', [])) >= 1000

          assert classifier.get('schema_version') == '1.3'
          assert classifier.get('classifier_version') == '1.8'
          assert classifier.get('target_reached') is True
          assert classifier.get('candidate_count') == history.get('candidate_count')
          assert classifier.get('accepted_count') == sources['yahoo_realtime_events'].get('count')
          assert classifier.get('accepted_count', 0) + classifier.get('rejected_count', 0) == history.get('candidate_count')
          assert classifier.get('quality', {}).get('duplicate_status_ids') == 0
          assert classifier.get('quality', {}).get('missing_source_created_at') == 0
          assert classifier.get('quality', {}).get('ambiguous_decisions') == 0

          assert vocabulary.get('schema_version') == '1.0'
          assert vocabulary.get('positive_event_count') == classifier.get('accepted_count')
          assert vocabulary.get('minimum_retweets') == 3
          assert vocabulary.get('adoption_policy') == 'reusable_structural_terms_only'
          assert {'イベント告知', '通常営業', 'リクイン'} & set(vocabulary.get('adopted_terms', []))
          assert {'本日', '応募'} <= set(vocabulary.get('excluded_as_too_generic', []))

          enriched = [item for item in events.get('events', []) if item.get('ontology_id')]
          assert len(enriched) == ontology_audit.get('matched_events')
          assert all(item.get('official_links') for item in enriched)
          PY

      - name: Publish static Pages assets
        run: |
          set -euo pipefail
          for file in \
            index.html \
            events.json \
            health.json \
            calendar.ics \
            event-ontology.json \
            ontology-match-audit.json \
            yahoo-candidate-history.json \
            yahoo-classifier-audit.json \
            yahoo-positive-vocabulary.json \
            .nojekyll; do
            cp "/tmp/cast-event-cal/$file" "./$file"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            index.html \
            events.json \
            health.json \
            calendar.ics \
            event-ontology.json \
            ontology-match-audit.json \
            yahoo-candidate-history.json \
            yahoo-classifier-audit.json \
            yahoo-positive-vocabulary.json \
            .nojekyll
          if git diff --cached --quiet; then
            echo 'Pages assets are already current'
          else
            git commit -m 'chore: publish canonical calendar [skip ci]'
            git push
          fi

      - name: Verify public Pages endpoints
        env:
          PAGE_BASE: https://kafka2306.github.io/vrc_cast_event_calender
        run: |
          set -euo pipefail
          root_status=000
          events_status=000
          health_status=000
          ontology_status=000
          ontology_audit_status=000
          history_status=000
          classifier_status=000
          vocabulary_status=000
          verified=false
          for attempt in $(seq 1 30); do
            root_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/live-index.html -w '%{http_code}' "$PAGE_BASE/" || true)"
            events_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/live-events.json -w '%{http_code}' "$PAGE_BASE/events.json" || true)"
            health_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/live-health.json -w '%{http_code}' "$PAGE_BASE/health.json" || true)"
            ontology_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/live-ontology.json -w '%{http_code}' "$PAGE_BASE/event-ontology.json" || true)"
            ontology_audit_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/live-ontology-audit.json -w '%{http_code}' "$PAGE_BASE/ontology-match-audit.json" || true)"
            history_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/live-yahoo-history.json -w '%{http_code}' "$PAGE_BASE/yahoo-candidate-history.json" || true)"
            classifier_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/live-yahoo-classifier.json -w '%{http_code}' "$PAGE_BASE/yahoo-classifier-audit.json" || true)"
            vocabulary_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/live-yahoo-vocabulary.json -w '%{http_code}' "$PAGE_BASE/yahoo-positive-vocabulary.json" || true)"
            if [ "$root_status" = '200' ] \
              && [ "$events_status" = '200' ] \
              && [ "$health_status" = '200' ] \
              && [ "$ontology_status" = '200' ] \
              && [ "$ontology_audit_status" = '200' ] \
              && [ "$history_status" = '200' ] \
              && [ "$classifier_status" = '200' ] \
              && [ "$vocabulary_status" = '200' ] \
              && grep -q 'VRChat Event Calendar' /tmp/live-index.html \
              && grep -q '公式リンク' /tmp/live-index.html \
              && python - <<'PY'
          import json
          events = json.load(open('/tmp/live-events.json', encoding='utf-8'))
          health = json.load(open('/tmp/live-health.json', encoding='utf-8'))
          ontology = json.load(open('/tmp/live-ontology.json', encoding='utf-8'))
          ontology_audit = json.load(open('/tmp/live-ontology-audit.json', encoding='utf-8'))
          history = json.load(open('/tmp/live-yahoo-history.json', encoding='utf-8'))
          classifier = json.load(open('/tmp/live-yahoo-classifier.json', encoding='utf-8'))
          vocabulary = json.load(open('/tmp/live-yahoo-vocabulary.json', encoding='utf-8'))
          sources = {item.get('name'): item for item in health.get('sources', [])}
          assert events.get('count', 0) >= 500
          assert health.get('event_count') == events.get('count')
          assert ontology.get('schema_version') == '1.1'
          assert ontology_audit.get('matched_events', 0) >= 2
          assert ontology_audit.get('ambiguous_events') == 0
          assert history.get('schema_version') == '2.3'
          assert history.get('candidate_count', 0) >= 1000
          assert history.get('retention_days') == 365
          assert classifier.get('schema_version') == '1.3'
          assert classifier.get('classifier_version') == '1.8'
          assert classifier.get('candidate_count') == history.get('candidate_count')
          assert classifier.get('accepted_count') == sources.get('yahoo_realtime_events', {}).get('count')
          assert classifier.get('quality', {}).get('missing_source_created_at') == 0
          assert vocabulary.get('positive_event_count') == classifier.get('accepted_count')
          assert vocabulary.get('minimum_retweets') == 3
          PY
            then
              verified=true
              break
            fi
            sleep 10
          done
          if [ "$verified" != 'true' ]; then
            echo "Pages verification failed: root=$root_status events=$events_status health=$health_status ontology=$ontology_status ontology_audit=$ontology_audit_status history=$history_status classifier=$classifier_status vocabulary=$vocabulary_status" >&2
            exit 1
          fi
          mkdir -p audit
          export ROOT_STATUS="$root_status" EVENTS_STATUS="$events_status" HEALTH_STATUS="$health_status"
          export ONTOLOGY_STATUS="$ontology_status" ONTOLOGY_AUDIT_STATUS="$ontology_audit_status"
          export HISTORY_STATUS="$history_status" CLASSIFIER_STATUS="$classifier_status" VOCABULARY_STATUS="$vocabulary_status"
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          live = json.loads(Path('/tmp/live-events.json').read_text(encoding='utf-8'))
          health = json.loads(Path('/tmp/live-health.json').read_text(encoding='utf-8'))
          ontology_audit = json.loads(Path('/tmp/live-ontology-audit.json').read_text(encoding='utf-8'))
          history = json.loads(Path('/tmp/live-yahoo-history.json').read_text(encoding='utf-8'))
          classifier = json.loads(Path('/tmp/live-yahoo-classifier.json').read_text(encoding='utf-8'))
          vocabulary = json.loads(Path('/tmp/live-yahoo-vocabulary.json').read_text(encoding='utf-8'))
          sources = {item.get('name'): item for item in health.get('sources', [])}
          result = {
              'schema_version': '6.0',
              'verified_at': datetime.now(UTC).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'canonical_repository': 'KAFKA2306/cast_event_cal',
              'page_url': 'https://kafka2306.github.io/vrc_cast_event_calender/',
              'root_status': int(os.environ['ROOT_STATUS']),
              'events_status': int(os.environ['EVENTS_STATUS']),
              'health_status': int(os.environ['HEALTH_STATUS']),
              'ontology_status': int(os.environ['ONTOLOGY_STATUS']),
              'ontology_audit_status': int(os.environ['ONTOLOGY_AUDIT_STATUS']),
              'yahoo_history_status': int(os.environ['HISTORY_STATUS']),
              'yahoo_classifier_audit_status': int(os.environ['CLASSIFIER_STATUS']),
              'yahoo_positive_vocabulary_status': int(os.environ['VOCABULARY_STATUS']),
              'event_count': live.get('count', 0),
              'enabled_sources': health.get('enabled_sources', 0),
              'yahoo_event_count': sources.get('yahoo_realtime_events', {}).get('count', 0),
              'yahoo_candidate_count': history.get('candidate_count', 0),
              'yahoo_rejected_count': classifier.get('rejected_count', 0),
              'yahoo_classifier_version': classifier.get('classifier_version'),
              'positive_vocabulary_terms': len(vocabulary.get('adopted_terms', [])),
              'ontology_matched_events': ontology_audit.get('matched_events', 0),
              'ontology_ambiguous_events': ontology_audit.get('ambiguous_events', 0),
              'status': 'ok',
          }
          Path('audit/production-status.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Record Pages verification
        run: |
          set -euo pipefail
          git add audit/production-status.json
          if git diff --cached --quiet; then
            echo 'No audit changes'
            exit 0
          fi
          git commit -m 'chore: record Pages verification [skip ci]'
          git pull --rebase origin main
          git push
