name: Verify and clean expanded series production sync

on:
  push:
    branches:
      - main
    paths:
      - ontology-match-audit.json
      - health.json
      - .github/workflows/cleanup-expanded-series-sync.yml

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify GitHub Pages and Cloudflare Pages
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          expected_audit = json.loads(Path('ontology-match-audit.json').read_text(encoding='utf-8'))
          expected_health = json.loads(Path('health.json').read_text(encoding='utf-8'))
          deploy_sha = os.environ['DEPLOY_SHA']
          sites = {
              'github_pages': 'https://kafka2306.github.io/vrc_cast_event_calender',
              'cloudflare_pages': 'https://vrc-cast-event-calender.pages.dev',
          }

          def fetch_json(url: str) -> dict:
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/json',
                      'Cache-Control': 'no-cache',
                      'User-Agent': 'cast-event-cal-production-verifier/1.0',
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  assert response.status == 200
                  return json.load(response)

          def is_current(audit: dict, health: dict) -> bool:
              return (
                  audit.get('schema_version') == expected_audit['schema_version']
                  and audit.get('event_count') == expected_audit['event_count']
                  and audit.get('ontology_entries') == expected_audit['ontology_entries']
                  and audit.get('matched_events') == expected_audit['matched_events']
                  and audit.get('unmatched_events') == expected_audit['unmatched_events']
                  and audit.get('ambiguous_events') == 0
                  and audit.get('matched_series') == expected_audit['matched_series']
                  and health.get('status') == 'ok'
                  and health.get('event_count') == expected_health['event_count']
                  and health.get('ontology') == expected_health['ontology']
              )

          last_status: dict[str, str] = {}
          for attempt in range(1, 61):
              all_current = True
              for name, base in sites.items():
                  suffix = f'?deploy={deploy_sha}&attempt={attempt}'
                  try:
                      audit = fetch_json(f'{base}/ontology-match-audit.json{suffix}')
                      health = fetch_json(f'{base}/health.json{suffix}')
                      current = is_current(audit, health)
                      last_status[name] = (
                          f"event_count={audit.get('event_count')}, "
                          f"entries={audit.get('ontology_entries')}, "
                          f"matched={audit.get('matched_events')}, "
                          f"unmatched={audit.get('unmatched_events')}, "
                          f"ambiguous={audit.get('ambiguous_events')}, "
                          f"status={health.get('status')}"
                      )
                      all_current &= current
                  except Exception as exc:  # network/deployment propagation
                      last_status[name] = f'{type(exc).__name__}: {exc}'
                      all_current = False
              if all_current:
                  break
              if attempt == 60:
                  raise AssertionError(f'production did not converge: {last_status}')
              time.sleep(10)

          cloudflare_request = urllib.request.Request(
              f"{sites['cloudflare_pages']}/?deploy={deploy_sha}",
              headers={'Cache-Control': 'no-cache', 'User-Agent': 'cast-event-cal-production-verifier/1.0'},
          )
          with urllib.request.urlopen(cloudflare_request, timeout=20) as response:
              assert response.status == 200
              assert response.headers.get('x-quality-view') == '2026-08-04-quality-view-v6'

          print(json.dumps({
              'deploy_sha': deploy_sha,
              'event_count': expected_audit['event_count'],
              'ontology_entries': expected_audit['ontology_entries'],
              'matched_events': expected_audit['matched_events'],
              'unmatched_events': expected_audit['unmatched_events'],
              'ambiguous_events': expected_audit['ambiguous_events'],
              'matched_series': len(expected_audit['matched_series']),
              'sites': last_status,
              'cloudflare_quality_view': '2026-08-04-quality-view-v6',
              'status': 'ok',
          }, ensure_ascii=False))
          PY
      - name: Delete implementation branch
        run: |
          set -euo pipefail
          branch='agent/sync-expanded-series-batches-2-3'
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch"
          fi
      - name: Remove one-time verification workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/cleanup-expanded-series-sync.yml
          git add .github/workflows/cleanup-expanded-series-sync.yml
          git commit -m 'chore: remove expanded series production verifier [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
