name: Finalize expanded series production assets

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/sync-expanded-series-batches-2-3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Preserve Cloudflare-specific runtime contract
        run: |
          set -euo pipefail
          test -f functions/index.js
          sha256sum functions/index.js > /tmp/cloudflare-function.sha256
      - name: Fetch canonical generated public assets
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/KAFKA2306/cast_event_cal.git /tmp/canonical
          rsync -a /tmp/canonical/public/ ./
      - name: Validate synchronized production data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          events = json.loads(Path('events.json').read_text(encoding='utf-8'))
          ontology = json.loads(Path('event-ontology.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('ontology-match-audit.json').read_text(encoding='utf-8'))
          health = json.loads(Path('health.json').read_text(encoding='utf-8'))

          event_count = events['count']
          assert event_count >= 600
          assert ontology['source_event_count'] == event_count
          assert ontology['curated_entry_count'] == 15
          assert audit['event_count'] == event_count
          assert audit['ontology_entries'] == 15
          assert audit['matched_events'] + audit['unmatched_events'] == event_count
          assert audit['ambiguous_events'] == 0
          assert len(audit['matched_series']) == 14
          assert audit['matched_series']['vrc-idle-gathering'] == 17
          assert audit['matched_series']['vrc-petting-zoo'] == 17
          assert health['status'] == 'ok'
          assert health['event_count'] == event_count
          assert health['ontology']['entries'] == audit['ontology_entries']
          assert health['ontology']['matched_events'] == audit['matched_events']
          assert health['ontology']['matched_series'] == len(audit['matched_series'])
          assert health['ontology']['unmatched_events'] == audit['unmatched_events']
          assert health['ontology']['ambiguous_events'] == 0
          assert Path('uiux-v4.css').is_file()
          assert Path('uiux-v4.js').is_file()
          assert Path('series-profile.js').is_file()
          print(json.dumps({
              'event_count': event_count,
              'ontology_entries': audit['ontology_entries'],
              'matched_events': audit['matched_events'],
              'unmatched_events': audit['unmatched_events'],
              'ambiguous_events': audit['ambiguous_events'],
              'matched_series': len(audit['matched_series']),
              'status': health['status'],
          }, ensure_ascii=False))
          PY
          cmp events.json /tmp/canonical/public/events.json
          cmp event-ontology.json /tmp/canonical/public/event-ontology.json
          cmp ontology-match-audit.json /tmp/canonical/public/ontology-match-audit.json
          cmp health.json /tmp/canonical/public/health.json
          sha256sum -c /tmp/cloudflare-function.sha256
          git diff --check -- . ':(exclude)calendar.ics'
      - name: Remove one-time synchronization workflows
        run: |
          rm -f .github/workflows/sync-expanded-series-assets.yml
          rm -f .github/workflows/finalize-expanded-series-assets.yml
      - name: Commit synchronized assets
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Sync expanded event series production assets'
          git pull --rebase origin "$GITHUB_HEAD_REF"
          git push origin HEAD:"$GITHUB_HEAD_REF"
