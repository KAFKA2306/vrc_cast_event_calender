name: Deploy canonical Pages v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-canonical-pages-v2.yml

permissions:
  contents: write

concurrency:
  group: canonical-pages-v2
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout compatibility repository
        uses: actions/checkout@v6
        with:
          ref: main
          path: production
          fetch-depth: 0

      - name: Checkout canonical repository
        uses: actions/checkout@v6
        with:
          repository: KAFKA2306/cast_event_cal
          ref: main
          path: canonical
          fetch-depth: 0

      - name: Validate canonical public contract
        run: |
          set -euo pipefail
          python canonical/scripts/audit_public_feed.py \
            canonical/public/events.json \
            --report /tmp/public-feed-audit.json
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('canonical/public')
          new_base = 'https://kafka2306.github.io/cast_event_cal/'
          old_base = 'https://kafka2306.github.io/vrc_cast_event_calender'
          events = json.loads((root / 'events.json').read_text(encoding='utf-8'))
          health = json.loads((root / 'health.json').read_text(encoding='utf-8'))
          feed = json.loads(Path('/tmp/public-feed-audit.json').read_text(encoding='utf-8'))
          index = (root / 'index.html').read_text(encoding='utf-8')
          assert events.get('count') == len(events.get('events', []))
          assert events.get('count', 0) > 0
          assert health.get('status') == 'ok'
          assert health.get('failed_sources') == 0
          assert health.get('event_count') == events.get('count')
          assert feed.get('error_count') == 0
          assert feed.get('unique_identity_count') == events.get('count')
          assert f'<link rel="canonical" href="{new_base}">' in index
          assert old_base not in index
          sitemap = ET.parse(root / 'sitemap.xml').getroot()
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [node.text for node in sitemap.findall('s:url/s:loc', ns)]
          assert urls and all(url and url.startswith(new_base) for url in urls)
          PY

      - name: Replace compatibility snapshot
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('production')
          manifest_path = root / 'projection-manifest.json'
          delivery_owned = {'_routes.json'}
          if manifest_path.is_file():
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              assets = manifest.get('assets', {})
              if not isinstance(assets, dict):
                  raise SystemExit('existing projection manifest has invalid assets')
              for name in assets:
                  relative = Path(name)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit(f'unsafe existing asset path: {name!r}')
                  if name in delivery_owned:
                      continue
                  target = root / relative
                  if target.is_file() or target.is_symlink():
                      target.unlink()
          PY
          cp -a canonical/public/. production/
          touch production/.nojekyll
          source_commit="$(git -C canonical rev-parse HEAD)"
          python production/scripts/write_projection_manifest.py \
            --canonical-root canonical/public \
            --source-commit "$source_commit" \
            --output production/projection-manifest.json
          python production/scripts/verify_projection_manifest.py \
            --root production \
            --manifest production/projection-manifest.json

      - name: Commit final compatibility snapshot
        working-directory: production
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Compatibility snapshot already matches canonical public/'
          else
            git commit -m 'chore: sync final canonical compatibility snapshot [skip ci]'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Verify live compatibility surface
        env:
          PAGE_BASE: https://kafka2306.github.io/vrc_cast_event_calender
        run: |
          set -euo pipefail
          base="${PAGE_BASE%/}"
          fetch() {
            curl --fail --location --silent --show-error --retry 12 --retry-delay 5 "$1"
          }
          fetch "$base/" > /tmp/index.html
          fetch "$base/events.json" > /tmp/events.json
          fetch "$base/calendar.ics" > /tmp/calendar.ics
          fetch "$base/tonight/" > /tmp/tonight.html
          grep -q '<link rel="canonical" href="https://kafka2306.github.io/cast_event_cal/">' /tmp/index.html
          ! grep -q '<link rel="canonical" href="https://kafka2306.github.io/vrc_cast_event_calender/">' /tmp/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/events.json').read_text(encoding='utf-8'))
          assert payload.get('count') == len(payload.get('events', []))
          assert payload.get('count', 0) > 0
          PY
          grep -q '^BEGIN:VCALENDAR' /tmp/calendar.ics
          grep -q '今夜のVRChat' /tmp/tonight.html
