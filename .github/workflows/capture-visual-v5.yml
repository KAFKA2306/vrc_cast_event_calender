name: Capture corrected production view

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-visual-v5.yml

permissions:
  contents: write

concurrency:
  group: capture-production-visual-v5
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Japanese font and browser client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.54.2 >/dev/null
      - name: Capture live v5 view
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          mkdir -p audit/visual/v5
          BROWSER_PATH="$browser" node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs/promises';

          const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.BROWSER_PATH,
            args: ['--no-sandbox'],
          });
          const base = 'https://vrc-cast-event-calender.pages.dev/';
          const report = {
            url: base,
            captured_at: new Date().toISOString(),
            quality_view: '2026-08-04-quality-view-v5',
            targets: {},
          };

          for (const target of [
            {name:'desktop',width:1440,height:1200},
            {name:'mobile',width:390,height:844},
          ]) {
            const page = await browser.newPage({
              viewport: { width: target.width, height: target.height },
              locale: 'ja-JP',
              timezoneId: 'Asia/Tokyo',
            });
            let ready = false;
            for (let attempt = 1; attempt <= 24; attempt += 1) {
              const response = await page.goto(`${base}?visual-v5=${Date.now()}-${attempt}`, {
                waitUntil: 'domcontentloaded',
                timeout: 90000,
              });
              await page.waitForTimeout(2500);
              const marker = await page.evaluate(() => document.documentElement.dataset.qualityView || '');
              const header = response?.headers()['x-quality-view'] || '';
              if (marker === '2026-08-04-quality-view-v5' && header === marker) {
                ready = true;
                break;
              }
              await page.waitForTimeout(2500);
            }
            if (!ready) throw new Error(`v5 not live for ${target.name}`);
            await page.waitForTimeout(2500);
            await page.screenshot({ path: `audit/visual/v5/${target.name}-viewport.png` });
            await page.screenshot({ path: `audit/visual/v5/${target.name}-full.png`, fullPage: true });
            report.targets[target.name] = await page.evaluate(() => {
              const box = selector => {
                const element = document.querySelector(selector);
                if (!element) return null;
                const rect = element.getBoundingClientRect();
                const style = getComputedStyle(element);
                return {
                  x: rect.x, y: rect.y, width: rect.width, height: rect.height,
                  right: rect.right, bottom: rect.bottom,
                  display: style.display, position: style.position,
                };
              };
              const overlaps = (left, right) => Boolean(
                left && right && !(left.right <= right.x || right.right <= left.x || left.bottom <= right.y || right.bottom <= left.y)
              );
              const hero = box('.hero');
              const command = box('.ux-command');
              const summary = box('.summary');
              const controls = box('.controls');
              const statusbar = box('.statusbar');
              const firstEvent = box('.event:not([hidden])');
              const recommendations = box('#recommendations');
              const mobileNav = box('.ux-mobile-nav');
              const visibleEvents = [...document.querySelectorAll('.event')].filter(event => !event.hidden);
              return {
                viewport: { width: innerWidth, height: innerHeight },
                document: {
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth,
                  scrollHeight: document.documentElement.scrollHeight,
                },
                qualityView: document.documentElement.dataset.qualityView || null,
                hero, command, summary, controls, statusbar, firstEvent, recommendations, mobileNav,
                first_event_inside_viewport: Boolean(firstEvent && firstEvent.y < innerHeight),
                horizontal_overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth,
                overlap: {
                  command_summary: overlaps(command, summary),
                  mobile_nav_controls: overlaps(mobileNav, controls),
                  mobile_nav_first_event: overlaps(mobileNav, firstEvent),
                },
                total_event_count: document.querySelectorAll('.event').length,
                visible_event_count: visibleEvents.length,
                hidden_event_count: document.querySelectorAll('.event[hidden]').length,
                recommendation_card_count: document.querySelectorAll('.recommendation-card').length,
                active_range: document.querySelector('.chip[data-range][aria-pressed=true]')?.dataset.range || null,
                title: document.querySelector('h1')?.textContent?.trim() || null,
                first_event_title: visibleEvents[0]?.querySelector('h2')?.textContent?.trim() || null,
              };
            });
            await page.close();
          }
          await browser.close();
          await fs.writeFile('audit/visual/v5/layout-report.json', JSON.stringify(report, null, 2) + '\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: production-visual-audit-v5
          path: audit/visual/v5
          retention-days: 7
      - name: Publish evidence and clean workflow
        run: |
          set -euo pipefail
          mkdir -p .github/audit
          printf '{"run_id":%s,"artifact_name":"production-visual-audit-v5"}\n' "$GITHUB_RUN_ID" > .github/audit/visual-v5-artifact-run.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/capture-visual-v5.yml
          git add audit/visual/v5 .github/audit/visual-v5-artifact-run.json .github/workflows/capture-visual-v5.yml
          git commit -m 'chore: record corrected production visual audit [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          branch='agent/capture-visual-v5'
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch"
          fi
