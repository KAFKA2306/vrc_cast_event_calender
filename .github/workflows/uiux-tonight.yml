name: Validate tonight event discovery
on:
  pull_request:
    paths:
      - "tonight/**"
      - ".github/workflows/uiux-tonight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - run: node --check tonight/tonight.js
      - name: Validate participation, URL and mobile contracts
        run: |
          grep -q '参加方法を見る' tonight/index.html
          grep -q '説明・分類根拠・証跡' tonight/index.html
          grep -q 'new URLSearchParams' tonight/tonight.js
          grep -q 'popstate' tonight/tonight.js
          grep -q 'function stateFor' tonight/tonight.js
          grep -q 'state-unknown' tonight/tonight.css
          grep -q 'min-height:44px' tonight/tonight.css
          grep -q '@media(max-width:620px)' tonight/tonight.css
          grep -q 'prefers-reduced-motion' tonight/tonight.css
