name: Export production visual audit artifact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-visual-audit-artifact.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate captured evidence
        run: |
          test -f audit/visual/current/desktop-viewport.png
          test -f audit/visual/current/mobile-viewport.png
          test -f audit/visual/current/layout-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-visual-audit
          path: audit/visual/current
          retention-days: 7
      - name: Record artifact run and clean workflow
        run: |
          set -euo pipefail
          mkdir -p .github/audit
          printf '{"run_id":%s,"artifact_name":"production-visual-audit"}\n' "$GITHUB_RUN_ID" > .github/audit/visual-artifact-run.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/export-visual-audit-artifact.yml
          git add .github/audit/visual-artifact-run.json .github/workflows/export-visual-audit-artifact.yml
          git commit -m 'chore: record visual audit artifact run [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          branch='agent/export-visual-audit-artifact'
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then git push origin --delete "$branch"; fi
