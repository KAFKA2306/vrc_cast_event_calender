name: Patch README snapshot verification

on:
  push:
    branches:
      - agent/verify-public-snapshot
    paths:
      - .github/workflows/patch-readme-snapshot-verification.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/verify-public-snapshot
      - name: Correct README facts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  """## 現在の重要な状態

2026年8月4日のdefault branch監査では、次の不整合を確認しています。

- `health.json`は`status: ok`、イベント601件、情報源5系統、ontology 15 entries、紐付け276件、曖昧一致0件を記録しています。
- `event-ontology.json`もsource event 601件を記録しています。
- 一方、default branchの`events.json`は0 byteです。
- `index.html`は`events.json`を取得してJSONとして読み込む実装です。

このため、GitHubに保存されたイベント本体とhealth・ontologyの間に整合性問題があります。Incident #22で復旧と再発防止を追跡しています。

**READMEの記述やhealthだけを根拠に、現在の公開一覧が正常とは判断しません。** GitHub PagesとCloudflare Pagesは個別に確認します。
""",
                  """## 現在の重要な状態

2026年8月4日、GitHub Actions run `30904241278`でdefault branch由来の公開snapshotをcheckoutし、実ファイルを直接検証しました。

- `events.json`: 1,949,391 bytes
- event件数: 601
- top-level形式: objectの`events`配列
- SHA-256: `bfa05322318ea350626e7e4a847dd62b034c6c25f751e26e9848ffae8183956f`
- `health.json`のevent件数: 601
- `event-ontology.json`のsource event件数: 601
- `ontology-match-audit.json`のevent件数: 601
- ontology entries: 15
- matched events: 276
- ambiguous events: 0

GitHub Contents APIは大容量fileの本文を返せない場合があります。空の`content` responseだけを見て、実ファイルが0 byteだと判断してはいけません。今回の0 byte判定は誤りであり、Incident #22へ訂正履歴を残しています。

この検証はrepository snapshotの整合を示します。GitHub PagesとCloudflare Pagesのproduction response、cache、表示内容は別に確認します。
""",
              ),
              (
                  """ただし、現在のdefault branchでは`events.json`が空であるため、復旧前は一覧の正常表示を期待できません。
""",
                  """`events.json`は約1.95MBあるため、GitHub Contents APIなどの閲覧toolでは本文が省略される場合があります。ローカルpreviewではrepositoryをcheckoutしてfile全体を利用してください。
""",
              ),
              (
                  """### データ整合

今後、少なくとも次を同じ検証で確認する必要があります。

- `events.json`が0 byteではない
- 有効なJSONである
- event件数が`health.json`と一致する
- 生成時刻が同じrunに属する
- ontology auditのsource countと一致する
- GitHub PagesとCloudflare Pagesの両方で同じrevisionを確認する

この不足はIncident #22で追跡しています。
""",
                  """### データ整合

`scripts/verify_public_snapshot.py`と`.github/workflows/verify-public-snapshot.yml`は、deploy repository自身をcheckoutして次を検証します。

- `events.json`が非空で有効なJSONである
- object wrapper内にevent配列がある
- event件数が`health.json`と一致する
- event件数が`event-ontology.json`と一致する
- event件数が`ontology-match-audit.json`と一致する
- byte数、payload形式、SHA-256、ontology件数をlogへ出力する

2026年8月4日のrun `30904241278`では、601件のsnapshotが全検証を通過しました。GitHub PagesとCloudflare Pagesのproduction確認は、このrepository内検証とは別のgateです。
""",
              ),
              (
                  """生成元、手動正準、生成物の完全な境界は、Incident #22の復旧時にREADMEと設計文書へ追加します。
""",
                  """イベント本体の生成正準は`KAFKA2306/cast_event_cal`側にあり、このdeploy repositoryへ公開snapshotが同期されます。deploy側でも受信snapshotを独立検証し、source側の成功だけを公開成功の証拠にしません。
""",
              ),
              (
                  """- 現在、default branchの`events.json`が空であり、復旧中です。
""",
                  """- `events.json`は大容量のobject wrapperであり、Contents APIや一部connectorでは本文を直接表示できません。
""",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"README replacement target not found:\n{old[:160]}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m "Correct the public snapshot status in README"
          git push origin HEAD:agent/verify-public-snapshot
