name: Verify public snapshot

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Verify public snapshot
        run: python scripts/verify_public_snapshot.py

      - name: Test projection manifest and parity contract
        run: |
          python -m py_compile \
            scripts/write_projection_manifest.py \
            scripts/verify_projection_manifest.py \
            tests/test_projection_manifest.py \
            tests/test_repository_boundary.py
          python -m unittest tests.test_projection_manifest tests.test_repository_boundary -v

      - name: Verify projection-only repository boundary
        run: |
          set -euo pipefail
          test ! -e .github/workflows/publish-yahoo-best-1000.yml
          test ! -e .github/workflows/publish-yahoo-query-ablation.yml
          test ! -e .github/workflows/sync-quality-view.yml
          test ! -e .github/workflows/rejection-metrics.yml
          test ! -e .github/workflows/weekly-repo-research.yml
          test ! -e .github/scripts/export_rejection_metrics.py
          test ! -e .github/tests/test_rejection_metrics.py
          test ! -e .github/audit/rejection-reasons-baseline.json
          test ! -e audit/rejection-reasons-current.json
          test ! -e audit/yahoo-query-ablation-status.json
          python - <<'PY'
          from pathlib import Path
          needle = 'raw.githubusercontent.com/' + 'KAFKA2306/cast_event_cal'
          offenders = [
              str(path)
              for path in Path('.github/workflows').glob('*.y*ml')
              if needle in path.read_text(encoding='utf-8')
          ]
          assert not offenders, f'partial canonical publishers remain: {offenders}'
          PY

      - name: Verify README canonical references
        run: |
          set -euo pipefail
          grep -q 'KAFKA2306/cast_event_cal/blob/main/docs/mcp.md' README.md
          grep -q 'KAFKA2306/cast_event_cal/blob/main/docs/SCRAPING_METHOD.md' README.md
          grep -q 'KAFKA2306/cast_event_cal/blob/main/README.md' README.md
          grep -q 'projection_only' README.md
          grep -q 'canonical_snapshot_acceptance_rate' docs/canonical-flow.md
          grep -q 'projection_freshness' docs/canonical-flow.md
          grep -q 'public_verification_success_rate' docs/canonical-flow.md

      - name: Remove test caches
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Verify checkout clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
