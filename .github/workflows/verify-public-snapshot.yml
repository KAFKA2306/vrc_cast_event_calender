name: Verify public snapshot

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Verify public snapshot
        run: python scripts/verify_public_snapshot.py

      - name: Test projection manifest contract
        run: |
          python -m py_compile scripts/write_projection_manifest.py tests/test_projection_manifest.py
          python -m unittest tests.test_projection_manifest -v

      - name: Verify projection-only repository boundary
        run: |
          set -euo pipefail
          test ! -e .github/workflows/publish-yahoo-best-1000.yml
          test ! -e .github/workflows/publish-yahoo-query-ablation.yml
          test ! -e .github/workflows/sync-quality-view.yml
          test ! -e .github/workflows/rejection-metrics.yml
          test ! -e .github/scripts/export_rejection_metrics.py
          test ! -e .github/tests/test_rejection_metrics.py
          test ! -e .github/audit/rejection-reasons-baseline.json
          test ! -e audit/rejection-reasons-current.json
          test ! -e audit/yahoo-query-ablation-status.json
          test "$(grep -RIl --include='*.yml' --include='*.yaml' 'contents: write' .github/workflows | sort)" = ".github/workflows/deploy-canonical-pages-v2.yml"

      - name: Generate and validate current snapshot manifest
        run: |
          set -euo pipefail
          python scripts/write_projection_manifest.py \
            --canonical-root . \
            --source-commit 1111111111111111111111111111111111111111 \
            --output /tmp/projection-manifest.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('/tmp/projection-manifest.json').read_text(encoding='utf-8'))
          events = json.loads(Path('events.json').read_text(encoding='utf-8'))
          assert manifest['schema_version'] == 'cast-event.projection-manifest.v2'
          assert manifest['role'] == 'projection_only'
          assert manifest['source_repository'] == 'KAFKA2306/cast_event_cal'
          assert manifest['source_commit_sha'] == '1' * 40
          assert manifest['event_count'] == events['count']
          assert manifest['collection_counts']['failed_sources'] == 0
          assert manifest['validation_status'] == 'validated'
          assert len(manifest['source_snapshot_sha256']) == 64
          assert manifest['data_contract']['classification_logic_in_this_repo'] is False
          assert manifest['data_contract']['independent_collection_in_this_repo'] is False
          for name, metadata in manifest['assets'].items():
              raw = Path(name).read_bytes()
              assert metadata['bytes'] == len(raw)
              assert metadata['sha256'] == hashlib.sha256(raw).hexdigest()
          PY

      - name: Verify checkout clean
        run: test -z "$(git status --porcelain)"
