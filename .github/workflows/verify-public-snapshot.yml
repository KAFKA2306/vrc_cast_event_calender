name: Verify public snapshot

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - "automation/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-public-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Compile verifier and tests
        run: python -m py_compile scripts/verify_public_snapshot.py tests/test_verify_public_snapshot.py

      - name: Run verifier unit tests
        run: python -m unittest tests.test_verify_public_snapshot -v

      - name: Verify public snapshot
        run: |
          python scripts/verify_public_snapshot.py \
            --report build/public-snapshot-audit.json
          test -s build/public-snapshot-audit.json

      - name: Upload snapshot audit
        if: always() && hashFiles('build/public-snapshot-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: public-snapshot-audit
          path: build/public-snapshot-audit.json
          retention-days: 30
          if-no-files-found: error
