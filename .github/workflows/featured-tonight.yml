name: Validate Featured Tonight sponsorships

on:
  pull_request:
    paths:
      - "sponsorships.json"
      - "tonight/**"
      - "scripts/verify_sponsorships.py"
      - "tests/test_verify_sponsorships.py"
      - "tests/featured-tonight-contract-test.js"
      - "docs/business/featured-tonight.md"
      - "metrics/featured-tonight-kpi.json"
      - ".github/workflows/featured-tonight.yml"
  push:
    branches: [main]
    paths:
      - "sponsorships.json"
      - "tonight/**"
      - "scripts/verify_sponsorships.py"
      - "tests/test_verify_sponsorships.py"
      - "tests/featured-tonight-contract-test.js"
      - "docs/business/featured-tonight.md"
      - "metrics/featured-tonight-kpi.json"
      - ".github/workflows/featured-tonight.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Compile validator without cache residue
        run: python -c "compile(open('scripts/verify_sponsorships.py', encoding='utf-8').read(), 'scripts/verify_sponsorships.py', 'exec')"
      - name: Sponsorship validator tests
        run: python -m unittest tests.test_verify_sponsorships -v
      - name: Validate production manifest against current event snapshot
        run: python scripts/verify_sponsorships.py
      - name: JavaScript syntax
        run: node --check tonight/featured-tonight.js
      - name: Sponsor/organic separation contract
        run: node tests/featured-tonight-contract-test.js
      - name: Clean checkout gate
        run: test -z "$(git status --porcelain --untracked-files=all)"
