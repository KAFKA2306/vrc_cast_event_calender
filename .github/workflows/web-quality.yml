name: Web quality

on:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.md"
      - ".github/workflows/web-quality.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.md"
      - ".github/workflows/web-quality.yml"
  workflow_run:
    workflows: ["Deploy canonical Pages v2"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance-links:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Nu HTML Checker
        id: vnu
        continue-on-error: true
        run: |
          mkdir -p .web-quality
          set -o pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/data:ro" \
            ghcr.io/validator/validator:latest \
            vnu --skip-non-html --format json --stdout /data \
            2>&1 | tee .web-quality/vnu.json

      - name: Check links with lychee
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --verbose
            README.md
            index.html
            docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-quality-conformance-${{ github.run_attempt }}
          path: .web-quality/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Enforce conformance and link gates
        if: always()
        env:
          VNU_OUTCOME: ${{ steps.vnu.outcome }}
          LYCHEE_OUTCOME: ${{ steps.lychee.outcome }}
        run: |
          printf 'vnu=%s\nlychee=%s\n' "$VNU_OUTCOME" "$LYCHEE_OUTCOME"
          test "$VNU_OUTCOME" = success
          test "$LYCHEE_OUTCOME" = success

  browser-a11y-performance:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install browser audit tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false @playwright/test@1.57.0 @axe-core/playwright@4.12.1 @lhci/cli@0.15.1
          npx playwright install --with-deps chromium

      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/web-quality-http.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/web-quality-http.log
          exit 1

      - name: Playwright + axe
        id: axe
        continue-on-error: true
        run: |
          mkdir -p .web-quality
          cat > .web-quality/a11y.spec.js <<'EOF'
          const fs = require('fs')
          const { test, expect } = require('@playwright/test')
          const AxeBuilder = require('@axe-core/playwright').default

          test('home page has no automatically detectable accessibility violations', async ({ page }) => {
            await page.goto('http://127.0.0.1:4173/')
            await page.waitForLoadState('networkidle')
            const results = await new AxeBuilder({ page }).analyze()
            const report = {
              url: page.url(),
              violations: results.violations.map(({ id, impact, help, helpUrl, nodes }) => ({
                id,
                impact,
                help,
                helpUrl,
                nodes: nodes.map(({ target, html, failureSummary }) => ({ target, html, failureSummary })),
              })),
              incomplete: results.incomplete.map(({ id, impact, help, helpUrl, nodes }) => ({
                id,
                impact,
                help,
                helpUrl,
                nodeCount: nodes.length,
              })),
            }
            fs.writeFileSync('.web-quality/axe-results.json', JSON.stringify(report, null, 2))
            expect(results.violations).toEqual([])
          })
          EOF
          cat > .web-quality/playwright.config.js <<'EOF'
          module.exports = {
            testDir: '.',
            workers: 1,
            use: { browserName: 'chromium' },
          }
          EOF
          npx playwright test --config=.web-quality/playwright.config.js

      - name: Lighthouse CI
        id: lighthouse
        continue-on-error: true
        run: |
          cat > .web-quality/lighthouserc.json <<'EOF'
          {
            "ci": {
              "assert": {
                "assertions": {
                  "categories:accessibility": ["error", {"minScore": 1}],
                  "categories:best-practices": ["error", {"minScore": 0.95}],
                  "categories:seo": ["error", {"minScore": 1}],
                  "categories:performance": ["warn", {"minScore": 0.4}],
                  "color-contrast": "error",
                  "errors-in-console": "error"
                }
              }
            }
          }
          EOF
          npx lhci collect \
            --url=http://127.0.0.1:4173/ \
            --numberOfRuns=1
          npx lhci assert --config=.web-quality/lighthouserc.json

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-quality-browser-${{ github.run_attempt }}
          path: |
            .web-quality/
            .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Enforce browser quality gates
        if: always()
        env:
          AXE_OUTCOME: ${{ steps.axe.outcome }}
          LIGHTHOUSE_OUTCOME: ${{ steps.lighthouse.outcome }}
        run: |
          printf 'axe=%s\nlighthouse=%s\n' "$AXE_OUTCOME" "$LIGHTHOUSE_OUTCOME"
          test "$AXE_OUTCOME" = success
          test "$LIGHTHOUSE_OUTCOME" = success
