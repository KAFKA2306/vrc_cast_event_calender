name: Rejection reason metrics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/rejection-metrics.yml
      - .github/scripts/export_rejection_metrics.py
      - .github/tests/test_rejection_metrics.py
      - .github/audit/rejection-reasons-baseline.json
      - .github/docs/rejection-metrics.md
  push:
    branches: [main]
    paths:
      - .github/workflows/rejection-metrics.yml
      - .github/scripts/export_rejection_metrics.py
      - .github/tests/test_rejection_metrics.py
      - .github/audit/rejection-reasons-baseline.json
      - .github/docs/rejection-metrics.md
  workflow_run:
    workflows: ["Sync from canonical event calendar"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: rejection-reason-metrics-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v6
        with:
          path: production
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Checkout canonical repository
        uses: actions/checkout@v6
        with:
          repository: KAFKA2306/cast_event_cal
          path: canonical
          ref: main

      - name: Compile and test metrics exporter
        run: |
          set -euo pipefail
          python -m py_compile \
            production/.github/scripts/export_rejection_metrics.py \
            production/.github/tests/test_rejection_metrics.py
          python -m unittest discover \
            -s production/.github/tests \
            -p 'test_rejection_metrics.py' \
            -v

      - name: Export and regression-check rejection metrics
        run: |
          set -euo pipefail
          python production/.github/scripts/export_rejection_metrics.py \
            --input canonical/public/yahoo-best-1000-audit.json \
            --baseline production/.github/audit/rejection-reasons-baseline.json \
            --output /tmp/rejection-reasons-current.json \
            --max-share-shift 0.15
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/rejection-reasons-current.json').read_text(encoding='utf-8'))
          assert payload['schema_version'] == '1.0'
          assert sum(payload['rejection_reason_counts'].values()) == payload['rejected_count']
          assert payload['candidate_count'] == payload['accepted_count'] + payload['rejected_count']
          PY

      - name: Upload machine-readable rejection snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rejection-reasons-${{ github.run_id }}
          path: /tmp/rejection-reasons-current.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: validate
    if: needs.validate.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout production main
        uses: actions/checkout@v6
        with:
          path: production
          ref: main
          fetch-depth: 0

      - name: Download validated rejection snapshot
        uses: actions/download-artifact@v5
        with:
          name: rejection-reasons-${{ github.run_id }}
          path: rejection-artifact

      - name: Commit versioned rejection snapshot
        working-directory: production
        run: |
          set -euo pipefail
          mkdir -p audit
          cp ../rejection-artifact/rejection-reasons-current.json audit/rejection-reasons-current.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/rejection-reasons-current.json
          if git diff --cached --quiet; then
            echo 'Rejection reason snapshot is already current'
          else
            git commit -m 'chore: record rejection reason snapshot [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
