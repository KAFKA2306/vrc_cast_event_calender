# trigger: 2026-08-03T19:25+09:00
name: Sync from canonical event calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '27 20 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-from-canonical.yml

permissions:
  contents: write

concurrency:
  group: production-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v6
        with:
          path: production
          fetch-depth: 0
      - name: Checkout public canonical repository
        uses: actions/checkout@v6
        with:
          repository: KAFKA2306/cast_event_cal
          path: canonical
      - name: Validate canonical assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('canonical/public')
          events = json.loads((base / 'events.json').read_text(encoding='utf-8'))
          assets = json.loads((base / 'official-asset-audit.json').read_text(encoding='utf-8'))
          links = json.loads((base / 'event-link-audit.json').read_text(encoding='utf-8'))
          ontology = json.loads((base / 'event-ontology.json').read_text(encoding='utf-8'))
          categories = json.loads((base / 'category-ontology.json').read_text(encoding='utf-8'))
          ontology_audit = json.loads((base / 'ontology-match-audit.json').read_text(encoding='utf-8'))
          html = (base / 'index.html').read_text(encoding='utf-8')
          rows = events['events']
          allowed = {item['id'] for item in categories['categories'] if item.get('id')}
          assert events['count'] > 555
          assert assets['counts']['official_x'] > 0
          assert assets['counts']['webp_image'] > 0
          assert links['events_with_primary_action'] > 0
          assert ontology['schema_version'] == '3.0'
          assert ontology['category_ontology_schema_version'] == '2.0'
          assert ontology['source_event_count'] == events['count']
          assert ontology['observed_entity_count'] > 2
          assert categories['schema_version'] == '2.0'
          assert all(row.get('category') in allowed for row in rows)
          assert ontology_audit['category_classification']['event_count'] == events['count']
          assert 'event-media-link' in html
          assert 'preferredActionUrl' in html
          assert 'id="recommendations"' in html
          assert '2026-08-03-local-history-recommend-v2' in html
          assert 'localStorage' in html
          assert 'MMR_RELEVANCE=0.82' in html
          PY
      - name: Synchronize public files
        run: |
          set -euo pipefail
          find production -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a canonical/public/. production/
          touch production/.nojekyll
      - name: Commit production assets
        working-directory: production
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Production assets already current'
          else
            git commit -m 'chore: publish canonical event calendar [skip ci]'
            git push origin HEAD:main
          fi
      - name: Verify GitHub Pages
        run: |
          set -euo pipefail
          base='https://kafka2306.github.io/vrc_cast_event_calender'
          verified=false
          for attempt in $(seq 1 36); do
            if curl -fsS "$base/events.json?run=${GITHUB_RUN_ID}-${attempt}" -o /tmp/events.json \
              && curl -fsS "$base/event-link-audit.json?run=${GITHUB_RUN_ID}-${attempt}" -o /tmp/links.json \
              && curl -fsS "$base/event-ontology.json?run=${GITHUB_RUN_ID}-${attempt}" -o /tmp/ontology.json \
              && curl -fsS "$base/category-ontology.json?run=${GITHUB_RUN_ID}-${attempt}" -o /tmp/categories.json \
              && curl -fsS "$base/ontology-match-audit.json?run=${GITHUB_RUN_ID}-${attempt}" -o /tmp/ontology-audit.json \
              && curl -fsS "$base/?run=${GITHUB_RUN_ID}-${attempt}" -o /tmp/index.html \
              && python - <<'PY'
          import json
          events=json.load(open('/tmp/events.json',encoding='utf-8'))
          links=json.load(open('/tmp/links.json',encoding='utf-8'))
          ontology=json.load(open('/tmp/ontology.json',encoding='utf-8'))
          categories=json.load(open('/tmp/categories.json',encoding='utf-8'))
          ontology_audit=json.load(open('/tmp/ontology-audit.json',encoding='utf-8'))
          html=open('/tmp/index.html',encoding='utf-8').read()
          rows=events['events']
          allowed={item['id'] for item in categories['categories'] if item.get('id')}
          assert events['count'] > 555
          assert links['events_with_primary_action'] > 0
          assert links['events_with_application'] > 0
          assert links['events_with_vrchat_group'] > 0
          assert ontology['schema_version'] == '3.0'
          assert ontology['category_ontology_schema_version'] == '2.0'
          assert ontology['source_event_count'] == events['count']
          assert ontology['observed_entity_count'] > 2
          assert categories['schema_version'] == '2.0'
          assert all(row.get('category') in allowed for row in rows)
          assert ontology_audit['category_classification']['event_count'] == events['count']
          assert any(row.get('image_url') and row.get('primary_action_url') for row in rows)
          assert 'event-media-link' in html
          assert 'id="recommendations"' in html
          assert '2026-08-03-local-history-recommend-v2' in html
          assert 'localStorage' in html
          assert 'MMR_RELEVANCE=0.82' in html
          PY
            then verified=true; break; fi
            sleep 10
          done
          test "$verified" = true
      - name: Record Pages verification
        working-directory: production
        run: |
          set -euo pipefail
          mkdir -p audit
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          events=json.load(open('/tmp/events.json',encoding='utf-8'))
          links=json.load(open('/tmp/links.json',encoding='utf-8'))
          ontology=json.load(open('/tmp/ontology.json',encoding='utf-8'))
          categories=json.load(open('/tmp/categories.json',encoding='utf-8'))
          result={
            'schema_version':'1.1',
            'verified_at':datetime.now(UTC).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'page_url':'https://kafka2306.github.io/vrc_cast_event_calender/',
            'event_count':events['count'],
            'events_with_primary_action':links['events_with_primary_action'],
            'events_with_application':links['events_with_application'],
            'events_with_vrchat_group':links['events_with_vrchat_group'],
            'ontology_schema_version':ontology['schema_version'],
            'category_ontology_schema_version':categories['schema_version'],
            'observed_entity_count':ontology['observed_entity_count'],
            'linked_image_count':sum(bool(row.get('image_url') and row.get('primary_action_url')) for row in events['events']),
            'recommendation_build':'2026-08-03-local-history-recommend-v2',
            'status':'ok',
          }
          Path('audit/link-ontology-pages-verification.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add audit/link-ontology-pages-verification.json
          git commit -m 'chore: record recommendation Pages verification [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
