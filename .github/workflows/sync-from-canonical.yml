# trigger: 2026-08-04T13:54+09:00
name: Sync from canonical event calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '27 20 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-from-canonical.yml

permissions:
  contents: write

concurrency:
  group: production-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v6
        with:
          path: production
          fetch-depth: 0
      - name: Checkout canonical repository
        uses: actions/checkout@v6
        with:
          repository: KAFKA2306/cast_event_cal
          path: canonical
          fetch-depth: 0
      - name: Wait for generated curated profiles
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 60); do
            git -C canonical fetch origin main
            git -C canonical reset --hard origin/main
            if python - <<'PY'
          import json
          from pathlib import Path
          base=Path('canonical/public')
          events=json.loads((base/'events.json').read_text(encoding='utf-8'))
          ontology=json.loads((base/'event-ontology.json').read_text(encoding='utf-8'))
          audit=json.loads((base/'ontology-match-audit.json').read_text(encoding='utf-8'))
          rows=events['events']
          assert events['count'] == len(rows) == 595
          assert ontology['schema_version'] == '3.0'
          assert ontology['curated_schema_version'] == '2.0'
          assert ontology['governance']['curation_mode'] == 'human_only'
          assert ontology['governance']['automatic_entry_creation'] is False
          assert ontology['governance']['automatic_entry_rewrite'] is False
          assert ontology['curated_entry_count'] == 7
          assert audit['ontology_entries'] == 7
          assert audit['matched_events'] == 121
          assert audit['unmatched_events'] == 474
          assert audit['ambiguous_events'] == 0
          assert sum(bool(row.get('series_profile')) for row in rows) == 121
          assert all(row.get('series_profile',{}).get('curation',{}).get('status') == 'human_curated' for row in rows if row.get('series_profile'))
          assert audit['category_classification']['event_count'] == events['count']
          assert (base/'series-profile.js').exists()
          PY
            then ready=true; break; fi
            sleep 10
          done
          test "$ready" = true
      - name: Validate canonical assets
        run: |
          set -euo pipefail
          node --check canonical/public/uiux-v4.js
          node --check canonical/public/series-profile.js
          grep -q 'CURATED SERIES PROFILE' canonical/public/series-profile.js
          grep -q '人手で確認したオントロジー' canonical/public/series-profile.js
          grep -q 'event-media-link' canonical/public/index.html
          grep -q 'id="recommendations"' canonical/public/index.html
      - name: Synchronize public files
        run: |
          set -euo pipefail
          find production -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a canonical/public/. production/
          touch production/.nojekyll
      - name: Commit production assets
        working-directory: production
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Production assets already current'
          else
            git commit -m 'chore: publish expanded event series links [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Verify GitHub Pages
        run: |
          set -euo pipefail
          base='https://kafka2306.github.io/vrc_cast_event_calender'
          verified=false
          for attempt in $(seq 1 48); do
            token="${GITHUB_RUN_ID}-${attempt}"
            if curl -fsS "$base/events.json?run=$token" -o /tmp/events.json \
              && curl -fsS "$base/event-ontology.json?run=$token" -o /tmp/ontology.json \
              && curl -fsS "$base/ontology-match-audit.json?run=$token" -o /tmp/audit.json \
              && curl -fsS "$base/series-profile.js?run=$token" -o /tmp/series-profile.js \
              && python - <<'PY'
          import json
          from pathlib import Path
          events=json.loads(Path('/tmp/events.json').read_text(encoding='utf-8'))
          ontology=json.loads(Path('/tmp/ontology.json').read_text(encoding='utf-8'))
          audit=json.loads(Path('/tmp/audit.json').read_text(encoding='utf-8'))
          profile=Path('/tmp/series-profile.js').read_text(encoding='utf-8')
          rows=events['events']
          assert events['count'] == len(rows) == 595
          assert ontology['curated_schema_version'] == '2.0'
          assert ontology['governance']['curation_mode'] == 'human_only'
          assert ontology['curated_entry_count'] == 7
          assert audit['matched_events'] == 121
          assert audit['ambiguous_events'] == 0
          assert sum(bool(row.get('series_profile')) for row in rows) == 121
          assert 'CURATED SERIES PROFILE' in profile
          PY
            then verified=true; break; fi
            sleep 10
          done
          test "$verified" = true
      - name: Record Pages verification
        working-directory: production
        run: |
          set -euo pipefail
          mkdir -p audit
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          events=json.loads(Path('/tmp/events.json').read_text(encoding='utf-8'))
          ontology=json.loads(Path('/tmp/ontology.json').read_text(encoding='utf-8'))
          audit=json.loads(Path('/tmp/audit.json').read_text(encoding='utf-8'))
          profiles=[row for row in events['events'] if row.get('series_profile')]
          result={
            'schema_version':'1.3',
            'verified_at':datetime.now(UTC).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'page_url':'https://kafka2306.github.io/vrc_cast_event_calender/',
            'event_count':events['count'],
            'curated_profile_event_count':len(profiles),
            'curated_entry_count':ontology['curated_entry_count'],
            'curated_schema_version':ontology['curated_schema_version'],
            'curation_mode':ontology['governance']['curation_mode'],
            'matched_series':audit['matched_series'],
            'ambiguous_events':audit['ambiguous_events'],
            'status':'ok',
          }
          Path('audit/link-ontology-pages-verification.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add audit/link-ontology-pages-verification.json
          git commit -m 'chore: record expanded series Pages verification [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
