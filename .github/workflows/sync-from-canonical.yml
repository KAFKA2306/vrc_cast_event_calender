# trigger: 2026-08-03T12:32+09:00
name: Sync from canonical event calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '27 20 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-from-canonical.yml

permissions:
  contents: write

concurrency:
  group: production-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v6
        with:
          path: production
          fetch-depth: 0
      - name: Checkout public canonical repository
        uses: actions/checkout@v6
        with:
          repository: KAFKA2306/cast_event_cal
          path: canonical
      - name: Validate canonical assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('canonical/public')
          audit = json.loads((base / 'yahoo-classifier-audit.json').read_text(encoding='utf-8'))
          assets = json.loads((base / 'official-asset-audit.json').read_text(encoding='utf-8'))
          events = json.loads((base / 'events.json').read_text(encoding='utf-8'))
          html = (base / 'index.html').read_text(encoding='utf-8')
          assert audit['classifier_version'] == '1.9'
          assert audit['accepted_count'] > 59
          assert events['count'] > 555
          assert assets['counts']['official_x'] > 0
          assert assets['counts']['official_web'] > 0
          assert assets['counts']['webp_image'] > 0
          assert 'event-media' in html and 'WebP画像' in html
          PY
      - name: Synchronize public files
        run: |
          set -euo pipefail
          find production -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a canonical/public/. production/
          touch production/.nojekyll
      - name: Commit production assets
        working-directory: production
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Production assets already current'
          else
            git commit -m 'chore: publish canonical event calendar [skip ci]'
            git push origin HEAD:main
          fi
      - name: Verify GitHub Pages
        run: |
          set -euo pipefail
          base='https://kafka2306.github.io/vrc_cast_event_calender'
          verified=false
          for attempt in $(seq 1 36); do
            if curl -fsS "$base/official-asset-audit.json?run=${GITHUB_RUN_ID}-${attempt}" -o /tmp/assets.json \
              && curl -fsS "$base/events.json?run=${GITHUB_RUN_ID}-${attempt}" -o /tmp/events.json \
              && curl -fsS "$base/?run=${GITHUB_RUN_ID}-${attempt}" -o /tmp/index.html \
              && python - <<'PY'
          import json
          assets = json.load(open('/tmp/assets.json', encoding='utf-8'))
          events = json.load(open('/tmp/events.json', encoding='utf-8'))
          html = open('/tmp/index.html', encoding='utf-8').read()
          assert assets['counts']['official_x'] > 0
          assert assets['counts']['official_web'] > 0
          assert assets['counts']['webp_image'] > 0
          assert any(row.get('official_x_url') for row in events['events'])
          assert any(row.get('official_website_url') for row in events['events'])
          assert any('format=webp' in str(row.get('image_url') or '') for row in events['events'])
          assert 'event-media' in html and 'WebP画像' in html
          PY
            then verified=true; break; fi
            sleep 10
          done
          test "$verified" = true
      - name: Record Pages verification
        working-directory: production
        run: |
          set -euo pipefail
          mkdir -p audit
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          assets = json.load(open('/tmp/assets.json', encoding='utf-8'))
          events = json.load(open('/tmp/events.json', encoding='utf-8'))
          result = {
              'schema_version': '1.0',
              'verified_at': datetime.now(UTC).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'page_url': 'https://kafka2306.github.io/vrc_cast_event_calender/',
              'event_count': events['count'],
              'official_x_count': assets['counts']['official_x'],
              'official_web_count': assets['counts']['official_web'],
              'webp_image_count': assets['counts']['webp_image'],
              'post_media_count': assets['counts']['post_media'],
              'profile_image_count': assets['counts']['profile_image'],
              'status': 'ok',
          }
          Path('audit/official-assets-pages-verification.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git add audit/official-assets-pages-verification.json
          git commit -m 'chore: record official asset Pages verification [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
